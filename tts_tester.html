<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Server Test Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .waveform-bar {
            transition: height 0.1s ease;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i class="fa-solid me-0 fa-wave-square text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">TTS Server Tester</h1>
                    <p class="text-xs text-slate-400">Панель тестирования синтеза речи и выбор голосов</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    Готов к работе
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 w-full">
        
        <!-- Main Controls & Input (2 columns) -->
        <section class="lg:col-span-2 space-y-6">
            
            <!-- Text Input Box -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-5 shadow-xl">
                <div class="flex items-center justify-between mb-3">
                    <label for="ttsText" class="font-semibold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-align-left text-indigo-400"></i> Текст для озвучивания
                    </label>
                    <span id="charCount" class="text-xs text-slate-400">0 символов</span>
                </div>
                
                <textarea id="ttsText" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-y text-sm leading-relaxed" placeholder="Введите текст, который необходимо синтезировать..."></textarea>
                
                <!-- Quick Presets -->
                <div class="mt-3 flex flex-wrap items-center gap-2">
                    <span class="text-xs text-slate-400">Быстрые шаблоны:</span>
                    <button type="button" onclick="setPreset('ru_short')" class="text-xs bg-slate-700/50 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded border border-slate-600 transition">
                        🇷🇺 Короткая фраза
                    </button>
                    <button type="button" onclick="setPreset('ru_long')" class="text-xs bg-slate-700/50 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded border border-slate-600 transition">
                        🇷🇺 Длинный текст
                    </button>
                    <button type="button" onclick="setPreset('en_sample')" class="text-xs bg-slate-700/50 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded border border-slate-600 transition">
                        🇬🇧 English Sample
                    </button>
                </div>
            </div>

            <!-- Voice Selection & Audio Controls -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-5 shadow-xl space-y-5">
                <h2 class="font-semibold text-slate-200 flex items-center gap-2 border-b border-slate-700/60 pb-3">
                    <i class="fa-solid fa-microphone-lines text-indigo-400"></i> Выбор голоса и Параметры
                </h2>

                <!-- Voice Selector Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    
                    <!-- Language Filter -->
                    <div>
                        <label for="langFilter" class="block text-xs font-medium text-slate-400 mb-1.5">Фильтр по языку</label>
                        <select id="langFilter" onchange="filterVoices()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="all">Все языки</option>
                            <option value="ru" selected>Русский (ru)</option>
                            <option value="en">English (en)</option>
                        </select>
                    </div>

                    <!-- Voice Dropdown Select -->
                    <div>
                        <label for="voiceSelect" class="block text-xs font-medium text-slate-400 mb-1.5">Голос диктора</label>
                        <select id="voiceSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <optgroup label="Серверные голоса">
                                <option value="aidar" selected>Aidar (Мужской)</option>
                                <option value="baya">Baya (Женский)</option>
                                <option value="kseniya">Kseniya (Женский)</option>
                                <option value="xenia">Xenia (Женский)</option>
                                <option value="eugene">Eugene (Мужской)</option>
                                <option value="random">Random (Случайный)</option>
                            </optgroup>
                            <optgroup label="Системные голоса (Web Speech)" id="browserVoices">
                                <option value="" disabled>Загрузка...</option>
                            </optgroup>
                        </select>                    </div>
                </div>

                <!-- Custom Voice ID (for custom server mode) -->
                <div id="customVoiceContainer" class="hidden">
                    <label for="customVoiceInput" class="block text-xs font-medium text-slate-400 mb-1.5">ID Голоса (для внешнего сервера)</label>
                    <input type="text" id="customVoiceInput" placeholder="например, alloy, echo, fable, onyx, nova, shimmer или silero_ru" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- Sliders for Rate, Pitch, Volume -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                    <!-- Speed / Rate -->
                    <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/40">
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-400">Скорость</span>
                            <span id="rateValue" class="font-mono text-indigo-400">1.0x</span>
                        </div>
                        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" oninput="document.getElementById('rateValue').textContent = this.value + 'x'" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <!-- Pitch -->
                    <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/40">
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-400">Высота тона</span>
                            <span id="pitchValue" class="font-mono text-indigo-400">1.0</span>
                        </div>
                        <input type="range" id="pitch" min="0.5" max="1.5" step="0.1" value="1" oninput="document.getElementById('pitchValue').textContent = this.value" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <!-- Volume -->
                    <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/40">
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-400">Громкость</span>
                            <span id="volumeValue" class="font-mono text-indigo-400">100%</span>
                        </div>
                        <input type="range" id="volume" min="0" max="1" step="0.05" value="1" oninput="document.getElementById('volumeValue').textContent = Math.round(this.value * 100) + '%'" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>

                <!-- Playback Buttons -->
                <div class="flex flex-wrap items-center gap-3 pt-2">
                    <button id="btnPlay" onclick="speakText()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 transition">
                        <i class="fa-solid fa-play"></i> Озвучить
                    </button>
                    <button id="btnPause" onclick="pauseSpeech()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition">
                        <i class="fa-solid fa-pause"></i> Пауза
                    </button>
                    <button id="btnStop" onclick="stopSpeech()" class="bg-rose-600/80 hover:bg-rose-600 text-white font-medium py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition">
                        <i class="fa-solid fa-stop"></i> Стоп
                    </button>
                </div>

                <!-- Visualizer -->
                <div class="bg-slate-950 rounded-lg p-4 border border-slate-800 flex items-center justify-center gap-1 h-16 overflow-hidden" id="visualizer">
                    <div class="waveform-bar w-1.5 bg-indigo-500/40 rounded-full h-2"></div>
                    <div class="waveform-bar w-1.5 bg-indigo-500/40 rounded-full h-3"></div>
                    <div class="waveform-bar w-1.5 bg-indigo-500/40 rounded-full h-2"></div>
                    <div class="waveform-bar w-1.5 bg-indigo-500/40 rounded-full h-5"></div>
                    <div class="waveform-bar w-1.5 bg-indigo-500/40 rounded-full h-2"></div>
                    <div class="waveform-bar w-1.5 bg-indigo-500/40 rounded-full h-4"></div>
                    <div class="waveform-bar w-1.5 bg-indigo-500/40 rounded-full h-2"></div>
                </div>
            </div>
        </section>

        <!-- Sidebar Options & API Server Settings -->
        <section class="space-y-6">
            
            <!-- Mode & Server Settings -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-5 shadow-xl space-y-4">
                <h2 class="font-semibold text-slate-200 flex items-center gap-2 border-b border-slate-700/60 pb-3">
                    <i class="fa-solid fa-sliders text-indigo-400"></i> Режим синтеза
                </h2>

                <!-- Mode Select -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">Движок / Провайдер</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="modeBrowserBtn" onclick="setEngineMode('browser')" class="py-2 px-3 text-xs font-medium rounded-lg border border-indigo-500 bg-indigo-600/20 text-indigo-300 flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-globe"></i> Web Speech
                        </button>
                        <button type="button" id="modeServerBtn" onclick="setEngineMode('server')" class="py-2 px-3 text-xs font-medium rounded-lg border border-slate-700 bg-slate-900 text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-server"></i> REST API
                        </button>
                    </div>
                </div>

                <!-- Server Config (Hidden in browser mode) -->
                <div id="serverConfigSection" class="space-y-3 hidden pt-2 border-t border-slate-700/50">
                    <div>
                        <label for="serverUrl" class="block text-xs font-medium text-slate-400 mb-1">URL Сервера TTS</label>
                        <input type="url" id="serverUrl" value="http://localhost:8000/v1/audio/speech" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500 font-mono">
                    </div>
                    <div>
                        <label for="apiKey" class="block text-xs font-medium text-slate-400 mb-1">API Key (необязательно)</label>
                        <input type="password" id="apiKey" placeholder="Bearer token..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500 font-mono">
                    </div>
                    <div>
                        <label for="audioFormat" class="block text-xs font-medium text-slate-400 mb-1">Формат ответа</label>
                        <select id="audioFormat" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <option value="mp3">MP3</option>
                            <option value="wav">WAV</option>
                            <option value="ogg">OGG</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Test Logs / History -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-5 shadow-xl space-y-3">
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                    <h2 class="font-semibold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i> История запусков
                    </h2>
                    <button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-rose-400 transition">Очистить</button>
                </div>

                <div id="historyList" class="space-y-2 max-h-56 overflow-y-auto pr-1 text-xs">
                    <p class="text-slate-500 text-center py-4">История запросов пуста</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Audio Element for API responses -->
    <audio id="audioPlayer" class="hidden"></audio>

    <script>
        // Global variables
        let synth = window.speechSynthesis;
        let voices = [];
        let engineMode = 'browser'; // 'browser' or 'server'
        let visualizerInterval = null;

        // Presets
        const presets = {
            ru_short: "Привет! Это проверка синтеза речи с выбором диктора.",
            ru_long: "Синтез речи (Text-to-Speech) — это технология преобразования письменного текста в естественный звучащий голос. Настройте скорость, высоту тона и выберите наиболее подходящий голос для воспроизведения.",
            en_sample: "Hello! This is a test for the text to speech server voice selection functionality."
        };

        // Initialize Page
        document.addEventListener('DOMContentLoaded', () => {
            const textarea = document.getElementById('ttsText');
            textarea.value = presets.ru_short;
            updateCharCount();
            
            textarea.addEventListener('input', updateCharCount);

            // Load speech synthesis voices
            if (synth) {
                populateVoiceList();
                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = populateVoiceList;
                }
            } else {
                updateStatus('Web Speech API не поддерживается', 'error');
            }
        });

        function updateCharCount() {
            const count = document.getElementById('ttsText').value.length;
            document.getElementById('charCount').textContent = `${count} символов`;
        }

        function setPreset(key) {
            if (presets[key]) {
                document.getElementById('ttsText').value = presets[key];
                updateCharCount();
            }
        }

        // Populate Voices Dropdown
        function populateVoiceList() {
            if (!synth) return;
            voices = synth.getVoices();
            filterVoices();
        }

        function filterVoices() {
            const langFilter = document.getElementById('langFilter').value;
            const browserGroup = document.getElementById('browserVoices');
            
            if (!browserGroup) return;
            browserGroup.innerHTML = ''; // Очищаем только системные голоса

            let filteredVoices = voices;
            if (langFilter !== 'all') {
                filteredVoices = voices.filter(v => v.lang.startsWith(langFilter));
            }

            if (filteredVoices.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.textContent = "Голоса не найдены для выбранного фильтра";
                browserGroup.appendChild(opt);
                return;
            }

            filteredVoices.forEach((voice) => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.textContent = `${voice.name} (${voice.lang})${voice.default ? ' — [По умолчанию]' : ''}`;
                
                // Автоматически не выбираем браузерный голос, так как по умолчанию выбран серверный
                browserGroup.appendChild(option);
            });
        }
        // Switch Engine Mode
        function setEngineMode(mode) {
            engineMode = mode;
            const browserBtn = document.getElementById('modeBrowserBtn');
            const serverBtn = document.getElementById('modeServerBtn');
            const serverConfig = document.getElementById('serverConfigSection');
            const customVoiceContainer = document.getElementById('customVoiceContainer');

            if (mode === 'browser') {
                browserBtn.className = "py-2 px-3 text-xs font-medium rounded-lg border border-indigo-500 bg-indigo-600/20 text-indigo-300 flex items-center justify-center gap-1.5";
                serverBtn.className = "py-2 px-3 text-xs font-medium rounded-lg border border-slate-700 bg-slate-900 text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1.5";
                serverConfig.classList.add('hidden');
                customVoiceContainer.classList.add('hidden');
            } else {
                serverBtn.className = "py-2 px-3 text-xs font-medium rounded-lg border border-indigo-500 bg-indigo-600/20 text-indigo-300 flex items-center justify-center gap-1.5";
                browserBtn.className = "py-2 px-3 text-xs font-medium rounded-lg border border-slate-700 bg-slate-900 text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1.5";
                serverConfig.classList.remove('hidden');
                customVoiceContainer.classList.remove('hidden');
            }
        }

        // Speak Action
        function speakText() {
            const text = document.getElementById('ttsText').value.trim();
            if (!text) {
                alert('Пожалуйста, введите текст для воспроизведения');
                return;
            }

            stopSpeech(); // Stop existing playback

            if (engineMode === 'browser') {
                speakBrowser(text);
            } else {
                speakServer(text);
            }
        }

        function speakBrowser(text) {
            if (!synth) return;

            const utterance = new SpeechSynthesisUtterance(text);
            const selectedVoiceName = document.getElementById('voiceSelect').value;
            const selectedVoice = voices.find(v => v.name === selectedVoiceName);

            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            utterance.rate = parseFloat(document.getElementById('rate').value);
            utterance.pitch = parseFloat(document.getElementById('pitch').value);
            utterance.volume = parseFloat(document.getElementById('volume').value);

            utterance.onstart = () => {
                updateStatus('Воспроизведение...', 'playing');
                startVisualizer();
                addHistoryItem('Web Speech API', selectedVoice ? selectedVoice.name : 'По умолчанию', text);
            };

            utterance.onend = () => {
                updateStatus('Готов к работе', 'ready');
                stopVisualizer();
            };

            utterance.onerror = (e) => {
                updateStatus('Ошибка воспроизведения', 'error');
                stopVisualizer();
                console.error(e);
            };

            synth.speak(utterance);
        }

        async function speakServer(text) {
            const serverUrl = document.getElementById('serverUrl').value;
            const apiKey = document.getElementById('apiKey').value;
            const format = document.getElementById('audioFormat').value;
            let voiceId = document.getElementById('customVoiceInput').value.trim();

            if (!voiceId) {
                voiceId = document.getElementById('voiceSelect').value || 'default';
            }

            updateStatus('Запрос к серверу...', 'playing');
            startVisualizer();

            try {
                const headers = {
                    'Content-Type': 'application/json'
                };
                if (apiKey) {
                    headers['Authorization'] = `Bearer ${apiKey}`;
                }

                const response = await fetch(serverUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        input: text,
                        voice: voiceId,
                        response_format: format,
                        speed: parseFloat(document.getElementById('rate').value)
                    })
                });

                if (!response.ok) {
                    throw new Error(`Ошибка сервера: ${response.status} ${response.statusText}`);
                }

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                const player = document.getElementById('audioPlayer');

                player.src = audioUrl;
                player.volume = parseFloat(document.getElementById('volume').value);
                
                player.onended = () => {
                    updateStatus('Готов к работе', 'ready');
                    stopVisualizer();
                };

                await player.play();
                addHistoryItem('REST API Server', voiceId, text);

            } catch (error) {
                console.error(error);
                updateStatus('Ошибка REST API', 'error');
                stopVisualizer();
                alert(`Не удалось получить аудио с сервера:\n${error.message}`);
            }
        }

        function pauseSpeech() {
            if (engineMode === 'browser' && synth) {
                if (synth.speaking && !synth.paused) {
                    synth.pause();
                    updateStatus('На паузе', 'ready');
                    stopVisualizer();
                } else if (synth.paused) {
                    synth.resume();
                    updateStatus('Воспроизведение...', 'playing');
                    startVisualizer();
                }
            } else {
                const player = document.getElementById('audioPlayer');
                if (!player.paused) {
                    player.pause();
                    updateStatus('На паузе', 'ready');
                    stopVisualizer();
                } else if (player.src) {
                    player.play();
                    updateStatus('Воспроизведение...', 'playing');
                    startVisualizer();
                }
            }
        }

        function stopSpeech() {
            if (synth) synth.cancel();
            
            const player = document.getElementById('audioPlayer');
            player.pause();
            player.currentTime = 0;

            stopVisualizer();
            updateStatus('Готов к работе', 'ready');
        }

        // Status Indicator
        function updateStatus(text, type) {
            const badge = document.getElementById('statusBadge');
            let colorClasses = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
            let dotClass = 'bg-emerald-400';

            if (type === 'playing') {
                colorClasses = 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20';
                dotClass = 'bg-indigo-400';
            } else if (type === 'error') {
                colorClasses = 'bg-rose-500/10 text-rose-400 border-rose-500/20';
                dotClass = 'bg-rose-400';
            }

            badge.className = `inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium border ${colorClasses}`;
            badge.innerHTML = `<span class="w-2 h-2 rounded-full ${dotClass} animate-pulse"></span> ${text}`;
        }

        // Animated Waveform Visualizer
        function startVisualizer() {
            const bars = document.querySelectorAll('.waveform-bar');
            if (visualizerInterval) clearInterval(visualizerInterval);
            
            visualizerInterval = setInterval(() => {
                bars.forEach(bar => {
                    const h = Math.floor(Math.random() * 28) + 6;
                    bar.style.height = `${h}px`;
                    bar.classList.replace('bg-indigo-500/40', 'bg-indigo-400');
                });
            }, 120);
        }

        function stopVisualizer() {
            if (visualizerInterval) clearInterval(visualizerInterval);
            const bars = document.querySelectorAll('.waveform-bar');
            bars.forEach(bar => {
                bar.style.height = '8px';
                bar.classList.replace('bg-indigo-400', 'bg-indigo-500/40');
            });
        }

        // History Log
        function addHistoryItem(engine, voice, text) {
            const historyList = document.getElementById('historyList');
            if (historyList.querySelector('p')) {
                historyList.innerHTML = '';
            }

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const item = document.createElement('div');
            item.className = 'bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/50 flex flex-col gap-1 hover:border-slate-600 transition';
            item.innerHTML = `
                <div class="flex items-center justify-between text-[11px]">
                    <span class="font-medium text-indigo-400">${engine}</span>
                    <span class="text-slate-500 font-mono">${time}</span>
                </div>
                <div class="text-slate-300 font-semibold truncate text-xs">🎤 ${voice}</div>
                <p class="text-slate-400 truncate text-[11px] font-sans">"${text}"</p>
            `;

            historyList.prepend(item);
        }

        function clearHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '<p class="text-slate-500 text-center py-4">История запросов пуста</p>';
        }
    </script>
</body>
</html>
