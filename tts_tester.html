<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестирование TTS Сервера</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
            padding: 28px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #1a1a1a;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4a5568;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3182ce;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2b6cb0;
        }

        button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }

        .player-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        .status {
            margin-top: 12px;
            font-size: 0.875rem;
            padding: 10px;
            border-radius: 6px;
            display: none;
            word-wrap: break-word;
        }

        .status.info {
            background-color: #ebf8ff;
            color: #2b6cb0;
            display: block;
        }

        .status.error {
            background-color: #fff5f5;
            color: #c53030;
            display: block;
        }

        .status.success {
            background-color: #f0fff4;
            color: #2f855a;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Тестирование TTS API</h1>

    <div class="row">
        <div class="form-group" style="flex: 2;">
            <label for="serverUrl">URL Эндпоинта</label>
            <input type="text" id="serverUrl" value="http://localhost:8000/speak_stream" placeholder="http://localhost:8000/speak_stream">
        </div>
        <div class="form-group" style="flex: 1;">
            <label for="httpMethod">Метод</label>
            <select id="httpMethod">
                <option value="GET">GET</option>
                <option value="POST" selected>POST</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="paramName">Имя параметра текста (JSON ключ или Query)</label>
        <input type="text" id="paramName" value="text" placeholder="text / query / prompt">
    </div>

    <div class="form-group">
        <label for="ttsText">Текст для озвучки</label>
        <textarea id="ttsText" placeholder="Введите текст для проверки синтеза речи...">Привет! Это тестовое сообщение для проверки работы TTS сервера.</textarea>
    </div>

    <button id="sendBtn" onclick="generateAudio()">Синтезировать аудио</button>

    <div id="statusBox" class="status"></div>

    <div class="player-section">
        <label>Результат воспроизведения</label>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<script>
    async function generateAudio() {
        const urlInput = document.getElementById('serverUrl').value.trim();
        const method = document.getElementById('httpMethod').value;
        const paramName = document.getElementById('paramName').value.trim();
        const text = document.getElementById('ttsText').value.trim();
        
        const btn = document.getElementById('sendBtn');
        const audioPlayer = document.getElementById('audioPlayer');

        if (!urlInput || !paramName || !text) {
            showStatus('Пожалуйста, заполните все поля.', 'error');
            return;
        }

        // Подготовка UI к загрузке
        btn.disabled = true;
        showStatus('Отправка запроса и генерация аудио...', 'info');
        audioPlayer.src = ''; 

        try {
            let fetchUrl = urlInput;
            const fetchOptions = {
                method: method,
                headers: {}
            };

            if (method === 'GET') {
                // Добавляем параметр в URL для GET-запроса
                const urlObj = new URL(fetchUrl, window.location.origin);
                urlObj.searchParams.append(paramName, text);
                fetchUrl = urlObj.toString();
            } else if (method === 'POST') {
                // Формируем JSON-тело для POST-запроса
                fetchOptions.headers['Content-Type'] = 'application/json';
                const bodyData = {};
                bodyData[paramName] = text;
                fetchOptions.body = JSON.stringify(bodyData);
            }

            const response = await fetch(fetchUrl, fetchOptions);

            if (!response.ok) {
                // Пытаемся прочитать текст ошибки от сервера, если есть
                let errorText = response.statusText;
                try {
                    const errJson = await response.json();
                    errorText = JSON.stringify(errJson);
                } catch(e) {
                    try { errorText = await response.text(); } catch(e2) {}
                }
                throw new Error(`Ошибка сервера ${response.status}: ${errorText}`);
            }

            // Читаем ответ как Blob (бинарный файл)
            const blob = await response.blob();
            
            if (blob.size === 0) {
                throw new Error('Сервер вернул пустой файл');
            }

            // Создаем временную ссылку на полученный аудиофайл
            const audioUrl = URL.createObjectURL(blob);
            audioPlayer.src = audioUrl;
            
            showStatus('Аудио успешно синтезировано!', 'success');
            
            // Пытаемся автоматически запустить воспроизведение
            audioPlayer.play().catch(e => {
                console.log('Автовоспроизведение заблокировано браузером', e);
            });

        } catch (error) {
            console.error(error);
            showStatus(`Произошла ошибка: ${error.message}`, 'error');
        } finally {
            btn.disabled = false;
        }
    }

    function showStatus(message, type) {
        const statusBox = document.getElementById('statusBox');
        statusBox.textContent = message;
        statusBox.className = `status ${type}`;
    }
</script>

</body>
</html>
